<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Demo</title>
    <style>
        @import url("./template.css");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            /* overflow: hidden; */
            background-color: var(--backgroundColor);
            overflow-x: auto;
        }

        h1 {
            font-family: 'helvetica-bold';
            margin-bottom: 16px;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--textColor);
            font-family: helvetica;
        }
        
        section {
            flex: 1;
            width: 100%;
            padding: 20px;
        }
        
        iframe {
            border: 1px solid var(--gray);
            background-color: white;
            border-radius: 8px;
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
        }
        
        button {
            font-family: helvetica;
            background-color: var(--gray);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--textColor);
            margin-left: 20px;
            padding: 5px 15px;
        }
        
        @media (hover: hover) {
            button:hover {
                cursor: pointer;
                background-color: var(--darkGray);
            }
        }

        
        section > div {
            display: flex;
            align-items: center;
            height: 10%;
        }

        section {
            padding-top: 0;
        }

        @media (max-width: 1300px) {
            body {
                overflow-y: auto;
                padding-top: 24px;
            }
            .container {
                width: 100%;
                height: auto;
            }

            section {
                width: 100%;
                padding-right: 0;
                padding-left: 0;
            }

            section > div {
                min-height: 50px;
                padding-right: 20px;
                padding-left: 20px;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 80vh;
                min-width: 100%;
            }

            section {
                min-height: 0;
                width: 80vh;
            }

            section > div {
                flex-wrap: wrap;
                gap: 8px;
                height: auto;
                padding-bottom: 12px;
            }

            h1 {
                width: 100%;
                margin-bottom: 0;
            }

            button {
                margin-left: 0;
            }

            iframe {
                width: 80vh;
                height: 60vh;
            }

        }
    </style>
</head>
<body>
    <div class="container">
         <section id="section1">
            <div>
                <h1>What you see</h1>
                <button onclick="connect()">Automatically Connect</button>
                <button onclick="window.location.reload()">Reset</button>
            </div>
         </section>
         <section id="section2">
            <div>
                <h1>What they see</h1>
            </div>
         </section>
    </div>
</body>
<script>
        const queryString = window.location.search;

        const params = new URLSearchParams(queryString);
        const name = params.get("name")
        let domain = "http://localhost:3000/"
        switch(name) {
            case "chat":
                domain = "https://cv-chat-app.netlify.app"
                break
            case "chess":
                domain = "https://cv-chess-app.netlify.app/"
        }

        const characters ='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        
        function generateString(length) {
            let result = '';
            const charactersLength = characters.length;
            for ( let i = 0; i < length; i++ ) {
                result += characters.charAt(Math.floor(Math.random() * charactersLength));
            }

            return result;
        }

        const ID = generateString(15)
        const PRODUCTION = true
    
        function prepareChatFrame(frameID, ID, connect = 0) {
            const ifrm = document.createElement("iframe")
            
            ifrm.setAttribute("height", "90%")
            ifrm.setAttribute("width", "100%")
            if(name === "chess") {
                ifrm.setAttribute("src",
                    connect ? `${domain}/?roomID=${ID}` : domain
                )
            }
            else if(name === "chat") {
                ifrm.setAttribute("src",
                    connect ? `${domain}/?keywords=nologin&chatID=${ID}` : domain
                )
            }
            ifrm.setAttribute("id", frameID)
            return ifrm
        }

        const section1 = document.querySelector("#section1")
        const section2 = document.querySelector("#section2")
        section1.appendChild(prepareChatFrame("chat-1", ID))
        section2.appendChild(prepareChatFrame("chat-2", ID))

        function connect() {
            let iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => iframe.remove());

            section1.appendChild(prepareChatFrame("chat-1", ID, 1))
            section2.appendChild(prepareChatFrame("chat-2", ID, 1))
        }   

</script>
</html>
